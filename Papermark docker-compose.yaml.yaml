# Papermark on Coolify  (Build Pack: Docker Compose)
# Put this file + Dockerfile.coolify in the root of your fork of papermark/papermark.
# Coolify generates SERVICE_FQDN_*, SERVICE_URL_*, SERVICE_USER_*, SERVICE_PASSWORD_* automatically.

services:
  papermark:
    build:
      context: .
      dockerfile: Dockerfile.coolify
      args:
        NEXT_PUBLIC_BASE_URL: ${SERVICE_URL_PAPERMARK}
        NEXT_PUBLIC_MARKETING_URL: ${SERVICE_URL_PAPERMARK}
        NEXT_PUBLIC_APP_BASE_HOST: ${APP_HOST:?set APP_HOST, e.g. docs.example.com}
        NEXT_PUBLIC_UPLOAD_TRANSPORT: s3
        NEXT_PUBLIC_WEBHOOK_BASE_URL: ${SERVICE_URL_PAPERMARK}
        NEXT_PUBLIC_WEBHOOK_BASE_HOST: ${APP_HOST}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis-http:
        condition: service_started
    environment:
      # --- Coolify routing (domain is set in the Coolify UI) ---
      - SERVICE_FQDN_PAPERMARK_3000
      - NODE_ENV=production

      # --- App URLs ---
      - NEXTAUTH_URL=${SERVICE_URL_PAPERMARK}
      - NEXT_PUBLIC_BASE_URL=${SERVICE_URL_PAPERMARK}
      - NEXT_PUBLIC_MARKETING_URL=${SERVICE_URL_PAPERMARK}
      - NEXT_PUBLIC_APP_BASE_HOST=${APP_HOST}
      - NEXT_PUBLIC_WEBHOOK_BASE_URL=${SERVICE_URL_PAPERMARK}
      - NEXT_PUBLIC_WEBHOOK_BASE_HOST=${APP_HOST}

      # --- Secrets (auto-generated by Coolify) ---
      - NEXTAUTH_SECRET=${SERVICE_BASE64_64_NEXTAUTH}
      - NEXT_PRIVATE_DOCUMENT_PASSWORD_KEY=${SERVICE_BASE64_64_DOCPASSWORD}
      - NEXT_PRIVATE_VERIFICATION_SECRET=${SERVICE_BASE64_64_VERIFICATION}

      # --- Database (internal Postgres) ---
      - POSTGRES_PRISMA_URL=postgresql://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/papermark?schema=public
      - POSTGRES_PRISMA_URL_NON_POOLING=postgresql://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/papermark?schema=public
      - POSTGRES_PRISMA_SHADOW_URL=postgresql://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/papermark?schema=public

      # --- Redis (self-hosted, Upstash-REST compatible via SRH) ---
      - UPSTASH_REDIS_REST_URL=http://redis-http:80
      - UPSTASH_REDIS_REST_TOKEN=${SERVICE_PASSWORD_SRH}
      - UPSTASH_REDIS_REST_LOCKER_URL=http://redis-http:80
      - UPSTASH_REDIS_REST_LOCKER_TOKEN=${SERVICE_PASSWORD_SRH}

      # --- Storage: S3-compatible (Cloudflare R2 / AWS S3 / Wasabi ...) ---
      - NEXT_PUBLIC_UPLOAD_TRANSPORT=s3
      - NEXT_PRIVATE_UPLOAD_ENDPOINT=${S3_ENDPOINT}                 # e.g. https://<accountid>.r2.cloudflarestorage.com
      - NEXT_PRIVATE_UPLOAD_REGION=${S3_REGION:-auto}
      - NEXT_PRIVATE_UPLOAD_BUCKET=${S3_BUCKET:-papermark}
      - NEXT_PRIVATE_ARCHIVE_BUCKET=${S3_ARCHIVE_BUCKET:-papermark-archive}
      - NEXT_PRIVATE_UPLOAD_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - NEXT_PRIVATE_UPLOAD_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      # Leave empty unless you use CloudFront signed URLs (needs KEY_ID + KEY_CONTENTS)
      - NEXT_PRIVATE_UPLOAD_DISTRIBUTION_HOST=${S3_DISTRIBUTION_HOST:-}

      # --- Email login (required: magic links are sent via Resend) ---
      - RESEND_API_KEY=${RESEND_API_KEY}

      # --- Optional: Google login ---
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}

      # --- Analytics (Tinybird, cloud/free tier) - views & stats ---
      - TINYBIRD_TOKEN=${TINYBIRD_TOKEN:-}

      # --- Background jobs (cloud services, optional but recommended) ---
      - TRIGGER_SECRET_KEY=${TRIGGER_SECRET_KEY:-}
      - TRIGGER_API_URL=${TRIGGER_API_URL:-https://api.trigger.dev}
      - QSTASH_TOKEN=${QSTASH_TOKEN:-}
      - QSTASH_CURRENT_SIGNING_KEY=${QSTASH_CURRENT_SIGNING_KEY:-}
      - QSTASH_NEXT_SIGNING_KEY=${QSTASH_NEXT_SIGNING_KEY:-}

      # --- Optional: passkeys ---
      - HANKO_API_KEY=${HANKO_API_KEY:-}
      - NEXT_PUBLIC_HANKO_TENANT_ID=${HANKO_TENANT_ID:-}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${SERVICE_USER_POSTGRES}
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - POSTGRES_DB=papermark
    volumes:
      - papermark-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - papermark-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Upstash REST API emulator so @upstash/redis + @upstash/ratelimit work locally
  redis-http:
    image: hiett/serverless-redis-http:latest
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - SRH_MODE=env
      - SRH_TOKEN=${SERVICE_PASSWORD_SRH}
      - SRH_CONNECTION_STRING=redis://redis:6379

volumes:
  papermark-postgres:
  papermark-redis:
